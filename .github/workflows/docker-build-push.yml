name: Build & Push Docker Image

on:
  push:
    branches:
      - production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Load environment variables
        run: |
          if [ -f .env.local ]; then
            cat .env.local >> $GITHUB_ENV
          fi
          # Add GitHub Actions secrets as environment variables
          echo "NEXT_PUBLIC_PRODUCTION_URL=${{ secrets.NEXT_PUBLIC_PRODUCTION_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_DEVELOPMENT_URL=${{ secrets.NEXT_PUBLIC_DEVELOPMENT_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SANITY_DATASET=${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SANITY_API_VERSION=${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_GA4_ID=${{ secrets.NEXT_PUBLIC_GA4_ID }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_GTM_ID=${{ secrets.NEXT_PUBLIC_GTM_ID }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_GAS_ID=${{ secrets.NEXT_PUBLIC_GAS_ID }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_ALGOLIA_APP_ID=${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY=${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CORAL_URL=${{ secrets.NEXT_PUBLIC_CORAL_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_STRIPE_MEMBERSHIP_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_MEMBERSHIP_PUBLISHABLE_KEY }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}" >> $GITHUB_ENV
          echo "SANITY_API_READ_TOKEN=${{ secrets.SANITY_API_READ_TOKEN }}" >> $GITHUB_ENV
          echo "SANITY_API_WRITE_TOKEN=${{ secrets.SANITY_API_WRITE_TOKEN }}" >> $GITHUB_ENV
          echo "SENTRY_ORG=${{ secrets.SENTRY_ORG }}" >> $GITHUB_ENV
          echo "SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}" >> $GITHUB_ENV
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> $GITHUB_ENV
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> $GITHUB_ENV
          echo "STRIPE_MEMBERSHIP_SECRET_KEY=${{ secrets.STRIPE_MEMBERSHIP_SECRET_KEY }}" >> $GITHUB_ENV
          echo "SUPABASE_MEMBERSHIP_URL=${{ secrets.SUPABASE_MEMBERSHIP_URL }}" >> $GITHUB_ENV
          echo "SUPABASE_MEMBERSHIP_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_MEMBERSHIP_SERVICE_ROLE_KEY }}" >> $GITHUB_ENV

      - name: Clean Docker images
        run: node scripts/docker-clean.js

      - name: Build Docker image
        run: node scripts/docker-build.js <<< "y"
        env:
          CI: true

      - name: Push Docker image to Docker Hub
        run: docker push untelevisedmedia/untelevised-media:latest

      - name: Notify deployment
        if: success()
        run: echo "✅ Docker image built and pushed successfully! Deploy with Coolify."
